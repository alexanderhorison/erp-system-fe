version: '3.8'
services:
  fe-erp:
    container_name: ${CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:3000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
    restart: unless-stopped
    networks:
      - tunnel

networks:
  tunnel:
    external: true
