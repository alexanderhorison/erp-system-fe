services:
  fe-erp:
    image: ${CONTAINER_NAME}:latest
    container_name: ${CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT}
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - tunnel

networks:
  tunnel:
    external: true
