version: '3.8'

services:
  # Frontend Web Service
  web-erp:
    container_name: web-erp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3001}:3001"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
