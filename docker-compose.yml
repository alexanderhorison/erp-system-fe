version: '3.8'
services:
  erp-system-fe:
    container_name: ${CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - tunnel

networks:
  tunnel:
    external: true
